<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Mhyles Gabb Aguilar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Mono&display=swap" />
  <link rel="stylesheet" href="site.css?v=2.0" />
  <link rel="stylesheet" href="contact.css?v=3.0" />
</head>
<body class="dark-mode">
  <div class="page-bg" aria-hidden="true">
    <span class="frame frame-1"></span>
    <span class="frame frame-2"></span>
    <span class="glow glow-1"></span>
    <span class="glow glow-2"></span>
  </div>

  <header class="site-header">
    <a href="index.html" class="logo">Gabb</a>
    <nav class="navbar">
      <a href="index.html" class="dashboard">Home</a>
      <a href="about.html" class="about-link">About</a>
      <a href="contact.html" class="contact-link">Contact</a>
    </nav>
  </header>

  <section class="contact-section">
    <div class="contact-intro">
      <span class="eyebrow">Contact</span>
      <h1 class="display-title contact-title">Let's<br />Talk</h1>
      <p class="subtitle">If you have something to talk about, feel free to message me!</p>
      <ul class="mono-links">
        <li><a href="https://www.facebook.com/share/1AMDVdaagG/" target="_blank" rel="noopener">Facebook</a></li>
        <li><a href="https://www.instagram.com/mhylesgabbaguilar?igsh=MWk3MGs1bTZ1Mm1sYw==" target="_blank" rel="noopener">Instagram</a></li>
      </ul>
    </div>

    <!-- Contact Form -->
    <form class="contact-form card" id="contactForm" action="https://formspree.io/f/xldbyekd" method="POST">
      <label class="field">
        <span>Name</span>
        <input type="text" name="name" placeholder="Your name" required />
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" required />
      </label>
      <label class="field">
        <span>Message</span>
        <textarea name="message" rows="6" placeholder="What's on your mind?" required></textarea>
      </label>
      <button type="submit" class="btn-primary btn-submit">Send Message</button>
    </form>
  </section>

  <!-- Success Toast Notification -->
  <div class="toast" id="successToast">
    <span class="toast-icon">✓</span>
    <span class="toast-message">Message sent successfully! I'll get back to you soon.</span>
  </div>

  <script>
    // Form Success Feedback
    const contactForm = document.getElementById('contactForm');
    const successToast = document.getElementById('successToast');

    contactForm.addEventListener('submit', function(e) {
      // Formspree will handle the submission
      // Show toast after submission
      setTimeout(() => {
        successToast.classList.add('show');
        setTimeout(() => {
          successToast.classList.remove('show');
        }, 4000);
      }, 500);
    });

    const path = window.location.pathname;
    if (path.includes('index') || path.endsWith('/')) {
      document.querySelector('.dashboard')?.classList.add('active');
    } else if (path.includes('about')) {
      document.querySelector('.about-link')?.classList.add('active');
    } else if (path.includes('contact')) {
      document.querySelector('.contact-link')?.classList.add('active');
    }
  </script>
</body>
</html>
